[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chataibotpro-webapi"
version = "1.0.0"
description = "Async Python wrapper for the chataibot.pro web app"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["chataibot", "chatai", "llm", "ai", "async", "unofficial", "wrapper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/cyber-wojtek/ChatAIBotPro-API"

[tool.hatch.build.targets.wheel]
packages = ["chataibotpro_webapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
